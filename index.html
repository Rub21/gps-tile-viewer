<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GPS tiles viewer</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
      html, body { height: 100%; margin: 0; }
      #map { height: 100%; }
      #panel {
        position: absolute; top: 10px; right: 10px; z-index: 1000;
        background: #fff; padding: 8px 10px; border-radius: 4px;
        font: 13px/1.6 sans-serif; box-shadow: 0 1px 4px rgba(0,0,0,.3);
        max-width: 320px;
      }
      #panel label { display: block; }
      #panel input[type=text], #panel select { width: 100%; box-sizing: border-box; }
      #panel small { color: #666; }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="panel">
      <label>Area
        <select id="areas"><option value="">Loading…</option></select>
      </label>
      <label>Tile server
        <input id="server" type="text" value="https://gps-tile.rub21.com/lines/{z}/{x}/{y}.png" />
      </label>
      <label><input id="basemap" type="checkbox" checked /> Base map</label>
      <label>GPS layer opacity <input id="opacity" type="range" min="0" max="1" step="0.1" value="1" /></label>
      <small id="updated"></small>
    </div>
    <script>
      var map = L.map("map");

      var base = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "© <a href=\"https://www.openstreetmap.org/copyright\">OpenStreetMap</a> contributors"
      }).addTo(map);

      var gps = L.tileLayer(document.getElementById("server").value, { maxZoom: 18 }).addTo(map);

      // #map=zoom/lat/lon like openstreetmap.org
      function readHash() {
        var m = location.hash.match(/^#map=(\d+)\/(-?[\d.]+)\/(-?[\d.]+)/);
        if (m) {
          map.setView([parseFloat(m[2]), parseFloat(m[3])], parseInt(m[1], 10));
          return true;
        }
        return false;
      }
      if (!readHash()) map.setView([20, 0], 2);

      map.on("moveend", function () {
        var c = map.getCenter();
        history.replaceState(null, "", "#map=" + map.getZoom() + "/" + c.lat.toFixed(4) + "/" + c.lng.toFixed(4));
      });
      window.addEventListener("hashchange", readHash);

      // Areas with data, generated by update-areas.py
      var select = document.getElementById("areas");
      fetch("areas.json")
        .then(function (r) { return r.json(); })
        .then(function (data) {
          select.innerHTML = "<option value=\"\">Jump to an area…</option>";
          data.areas.forEach(function (a, i) {
            var opt = document.createElement("option");
            opt.value = i;
            opt.textContent = a.name + " (" + Math.round(a.points / 1000) + "k pts)";
            select.appendChild(opt);
          });
          select.addEventListener("change", function () {
            var a = data.areas[select.value];
            if (a) map.setView([a.lat, a.lon], a.zoom);
          });
          document.getElementById("updated").textContent = "Areas updated " + data.updated;
        })
        .catch(function () {
          select.innerHTML = "<option value=\"\">areas.json not found</option>";
        });

      document.getElementById("server").addEventListener("change", function (e) {
        gps.setUrl(e.target.value);
      });
      document.getElementById("basemap").addEventListener("change", function (e) {
        e.target.checked ? base.addTo(map) : map.removeLayer(base);
      });
      document.getElementById("opacity").addEventListener("input", function (e) {
        gps.setOpacity(parseFloat(e.target.value));
      });
    </script>
  </body>
</html>
